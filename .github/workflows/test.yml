name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellspec:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zsh git tmux ripgrep python3 iproute2
      - name: Install fzf (Linux)
        if: runner.os == 'Linux'
        run: |
          base=https://github.com/junegunn/fzf/releases/download
          curl -fsSL "$base/v0.57.0/fzf-0.57.0-linux_amd64.tar.gz" |
            sudo tar -xz -C /usr/local/bin fzf
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install fzf tmux ripgrep
      - name: Install ShellSpec
        run: |
          git clone --depth 1 --branch 0.28.1 \
            https://github.com/shellspec/shellspec.git "$HOME/shellspec"
          echo "$HOME/shellspec" >> "$GITHUB_PATH"
      - name: Check syntax
        run: |
          for file in fzf.plugin.zsh functions/* completions/*; do
            zsh -n "$file"
          done
      - run: shellspec
        env:
          UI_WAIT: 300
